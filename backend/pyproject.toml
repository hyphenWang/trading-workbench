[project]
name = "local-tradingview-backend"
version = "0.1.0"
description = "本地交易工作台后端：多市场行情数据服务 + 专业回测引擎"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "akshare>=1.15.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
